#cloud-config

# OpenClaw Instance Auto-Configuration
# Fully automatic setup - users access everything via web dashboard
# NOTE: This is a template. The actual script is generated dynamically
#       with the password injected via generateCloudInit() in instances.ts

# Set root password (injected dynamically)
chpasswd:
    list: |
        root:YOUR_PASSWORD_HERE
    expire: false

package_update: true
package_upgrade: true

packages:
    - git
    - curl
    - wget
    - vim
    - htop
    - nginx
    - certbot
    - python3-certbot-nginx
    - ufw
    - ca-certificates
    - gnupg

runcmd:
    # Install Node.js 22 (required for OpenClaw)
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update
    - apt-get install -y nodejs

    # Install OpenClaw globally
    - npm install -g openclaw@latest

    # Create openclaw user for running the service
    - useradd -r -m -d /home/openclaw -s /bin/bash openclaw

    # Create OpenClaw directories and config
    - mkdir -p /home/openclaw/.openclaw

    # Generate a random token for gateway auth, enable insecure auth for HTTP access, and trust nginx proxy
    - |
        TOKEN=$(openssl rand -hex 32)
        cat > /home/openclaw/.openclaw/openclaw.json << OCCONFIG
        {
          "gateway": {
            "mode": "local",
            "auth": {
              "token": "$TOKEN"
            },
            "controlUi": {
              "allowInsecureAuth": true
            },
            "trustedProxies": ["127.0.0.1", "::1"]
          }
        }
        OCCONFIG

    - chown -R openclaw:openclaw /home/openclaw

    # Create systemd service for OpenClaw (system-level for always-on)
    - |
        cat > /etc/systemd/system/openclaw-gateway.service <<'SYSTEMD'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target

        [Service]
        Type=simple
        User=openclaw
        Group=openclaw
        WorkingDirectory=/home/openclaw
        Environment=HOME=/home/openclaw
        Environment=NODE_ENV=production
        ExecStart=/usr/bin/openclaw gateway --port 18789 --bind loopback
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        SYSTEMD

    # Enable and start OpenClaw service
    - systemctl daemon-reload
    - systemctl enable openclaw-gateway
    - systemctl start openclaw-gateway

    # Configure firewall
    - ufw allow 22/tcp
    - ufw allow 80/tcp
    - ufw allow 443/tcp
    - ufw --force enable

    # Create Nginx reverse proxy config for OpenClaw dashboard
    - |
        cat > /etc/nginx/sites-available/openclaw <<'NGINX'
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;

            # OpenClaw Dashboard & API (WebSocket support for real-time updates)
            location / {
                proxy_pass http://127.0.0.1:18789;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 86400;
                proxy_send_timeout 86400;
            }
        }
        NGINX

    # Enable the site and start Nginx
    - ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/
    - rm -f /etc/nginx/sites-enabled/default
    - nginx -t && systemctl reload nginx
    - systemctl enable nginx

final_message: 'OpenClaw instance ready! Access dashboard at http://<ip>/'
