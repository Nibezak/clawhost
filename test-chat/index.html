<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OpenClaw Chat Test</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            claw: {
                                bg: '#0a0a0a',
                                surface: '#141414',
                                border: '#262626',
                                accent: '#e11d48',
                                text: '#fafafa',
                                muted: '#737373'
                            }
                        }
                    }
                }
            }
        </script>
    </head>
    <body class="bg-claw-bg text-claw-text flex h-screen flex-col">
        <div id="app" class="mx-auto flex h-full w-full max-w-2xl flex-col">
            <header
                class="border-claw-border flex items-center justify-between border-b px-4 py-3"
            >
                <div class="flex items-center gap-3">
                    <div
                        class="bg-claw-accent flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold"
                    >
                        C
                    </div>
                    <div>
                        <h1 class="text-sm font-semibold">OpenClaw Agent</h1>
                        <p id="status" class="text-claw-muted text-xs">
                            Disconnected
                        </p>
                    </div>
                </div>
                <button
                    onclick="toggleConnection()"
                    id="connectBtn"
                    class="bg-claw-accent hover:bg-claw-accent/80 rounded-md px-3 py-1.5 text-xs font-medium transition-colors"
                >
                    Connect
                </button>
            </header>

            <div
                id="messages"
                class="flex-1 space-y-3 overflow-y-auto px-4 py-4"
            >
                <div class="flex justify-center">
                    <span
                        class="text-claw-muted bg-claw-surface rounded-full px-3 py-1 text-xs"
                        >Connect first, then send a message</span
                    >
                </div>
            </div>

            <form
                onsubmit="sendMessage(event)"
                class="border-claw-border border-t px-4 py-3"
            >
                <div class="flex gap-2">
                    <input
                        id="input"
                        type="text"
                        placeholder="Type a message..."
                        autocomplete="off"
                        disabled
                        class="bg-claw-surface border-claw-border text-claw-text placeholder-claw-muted focus:border-claw-accent flex-1 rounded-lg border px-4 py-2.5 text-sm transition-colors focus:outline-none disabled:opacity-50"
                    />
                    <button
                        id="sendBtn"
                        type="submit"
                        disabled
                        class="bg-claw-accent hover:bg-claw-accent/80 disabled:hover:bg-claw-accent rounded-lg px-4 py-2.5 text-sm font-medium transition-colors disabled:opacity-50"
                    >
                        Send
                    </button>
                </div>
            </form>
        </div>

        <script>
            const GATEWAY_URL = 'wss://zan5z32.clawhost.cloud'
            const GATEWAY_TOKEN =
                '9e098b052a549c645bb177bd0747d443141d7c5da9708304709e098471c1ad6a'

            let sessionKey = ''
            let ws = null
            let connected = false
            let sending = false
            let pollTimer = null
            let renderedSignature = ''
            const waiters = new Map()

            function uuid() {
                return crypto.randomUUID()
            }

            function setStatus(text, color) {
                const el = document.getElementById('status')
                el.textContent = text
                el.className = `text-xs ${color}`
            }

            function setInputEnabled(enabled) {
                document.getElementById('input').disabled = !enabled
                document.getElementById('sendBtn').disabled = !enabled
            }

            function addMessage(content, sender) {
                const container = document.getElementById('messages')
                const wrapper = document.createElement('div')
                wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`

                const bubble = document.createElement('div')
                bubble.className =
                    sender === 'user'
                        ? 'max-w-[80%] bg-claw-accent rounded-2xl rounded-br-sm px-4 py-2.5 text-sm'
                        : 'max-w-[80%] bg-claw-surface border border-claw-border rounded-2xl rounded-bl-sm px-4 py-2.5 text-sm whitespace-pre-wrap'

                bubble.textContent = content
                wrapper.appendChild(bubble)
                container.appendChild(wrapper)
                container.scrollTop = container.scrollHeight
                return bubble
            }

            function addSystemMessage(content) {
                const container = document.getElementById('messages')
                const wrapper = document.createElement('div')
                wrapper.className = 'flex justify-center'
                wrapper.innerHTML = `<span class='text-xs text-claw-muted bg-claw-surface px-3 py-1 rounded-full'>${content}</span>`
                container.appendChild(wrapper)
                container.scrollTop = container.scrollHeight
            }

            function extractText(msg) {
                if (typeof msg.content === 'string') return msg.content
                if (Array.isArray(msg.content)) {
                    return msg.content
                        .filter((c) => c.type === 'text')
                        .map((c) => c.text)
                        .join('\n')
                }
                return ''
            }

            function renderHistory(messages) {
                const filtered = []
                for (const msg of messages) {
                    if (msg.role === 'toolResult' || msg.role === 'toolCall')
                        continue
                    const text = extractText(msg)
                    if (!text.trim()) continue
                    filtered.push({
                        text,
                        sender: msg.role === 'user' ? 'user' : 'agent'
                    })
                }

                const sig = filtered
                    .map((m) => m.sender + ':' + m.text.slice(0, 80))
                    .join('|')
                if (sig === renderedSignature) return
                renderedSignature = sig

                if (filtered.length === 0) return

                const container = document.getElementById('messages')
                container.innerHTML = ''

                for (const m of filtered) {
                    addMessage(m.text, m.sender)
                }
            }

            function wsRequest(method, params) {
                return new Promise((resolve, reject) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        return reject(new Error('Not connected'))
                    }
                    const id = uuid()
                    waiters.set(id, { resolve, reject })
                    ws.send(
                        JSON.stringify({
                            type: 'req',
                            id,
                            method,
                            params: params || {}
                        })
                    )
                })
            }

            function toggleConnection() {
                if (connected) {
                    disconnect()
                } else {
                    connect()
                }
            }

            function connect() {
                if (ws) ws.close()

                setStatus('Connecting...', 'text-yellow-500')
                const btn = document.getElementById('connectBtn')
                btn.textContent = 'Connecting...'
                btn.disabled = true

                ws = new WebSocket(GATEWAY_URL)

                ws.onopen = () => {
                    setStatus('Authenticating...', 'text-yellow-500')
                }

                ws.onmessage = (event) => {
                    let data
                    try {
                        data = JSON.parse(event.data)
                    } catch {
                        return
                    }

                    console.log(
                        '[ws]',
                        data.type,
                        data.event || data.method || '',
                        data
                    )

                    if (
                        data.type === 'event' &&
                        data.event === 'connect.challenge'
                    ) {
                        const id = uuid()
                        waiters.set(id, {
                            resolve: (payload) => {
                                connected = true
                                setStatus('Connected', 'text-green-500')
                                setInputEnabled(true)
                                btn.textContent = 'Disconnect'
                                btn.disabled = false
                                addSystemMessage(
                                    'Connected to OpenClaw gateway'
                                )
                                resolveSession()
                            },
                            reject: (err) => {
                                setStatus(
                                    'Auth failed: ' + err.message,
                                    'text-red-500'
                                )
                                addSystemMessage('Auth failed: ' + err.message)
                                btn.textContent = 'Connect'
                                btn.disabled = false
                            }
                        })

                        ws.send(
                            JSON.stringify({
                                type: 'req',
                                id,
                                method: 'connect',
                                params: {
                                    minProtocol: 3,
                                    maxProtocol: 3,
                                    client: {
                                        id: 'gateway-client',
                                        displayName: 'clawhost-chat',
                                        version: '1.0.0',
                                        platform: 'web',
                                        mode: 'ui',
                                        instanceId: uuid()
                                    },
                                    auth: { token: GATEWAY_TOKEN },
                                    role: 'operator',
                                    scopes: ['operator.admin']
                                }
                            })
                        )
                        return
                    }

                    if (data.type === 'res') {
                        const w = waiters.get(data.id)
                        if (w) {
                            waiters.delete(data.id)
                            if (data.ok) w.resolve(data.payload)
                            else
                                w.reject(
                                    new Error(
                                        data.error?.message || 'gateway error'
                                    )
                                )
                        }
                        return
                    }

                    if (data.type === 'event') {
                        handleEvent(data)
                    }
                }

                ws.onclose = () => {
                    connected = false
                    setStatus('Disconnected', 'text-claw-muted')
                    setInputEnabled(false)
                    stopPolling()
                    btn.textContent = 'Connect'
                    btn.disabled = false
                }

                ws.onerror = () => {
                    setStatus('Connection error', 'text-red-500')
                    btn.textContent = 'Connect'
                    btn.disabled = false
                }
            }

            function disconnect() {
                stopPolling()
                if (ws) ws.close()
                ws = null
                connected = false
            }

            let streamBubble = null

            function handleEvent(data) {
                const event = data.event
                const payload = data.payload || {}
                console.log('[event]', event, payload)

                if (event === 'chat') {
                    if (
                        payload.state === 'delta' ||
                        payload.state === 'final'
                    ) {
                        const msg = payload.message
                        if (msg) {
                            const text = extractText(msg)
                            if (text) {
                                if (!streamBubble) {
                                    streamBubble = addMessage(text, 'agent')
                                } else {
                                    streamBubble.textContent = text
                                }
                                document.getElementById('messages').scrollTop =
                                    document.getElementById(
                                        'messages'
                                    ).scrollHeight
                            }
                        }
                    }

                    if (payload.state === 'final') {
                        streamBubble = null
                        setStatus('Connected', 'text-green-500')
                    }
                    return
                }
            }

            async function resolveSession() {
                try {
                    const sessions = await wsRequest('sessions.list', {})
                    console.log('[sessions]', sessions)

                    if (Array.isArray(sessions) && sessions.length > 0) {
                        const latest = sessions[sessions.length - 1]
                        sessionKey = latest.key || latest.sessionKey || 'main'
                        console.log('[resolved session]', sessionKey)
                    } else {
                        sessionKey = 'main'
                    }

                    await loadHistory()
                } catch (err) {
                    console.error('[sessions error]', err)
                    sessionKey = 'main'
                }
            }

            async function loadHistory() {
                if (!sessionKey) return
                try {
                    const history = await wsRequest('chat.history', {
                        sessionKey,
                        limit: 500
                    })
                    console.log('[history]', history)
                    if (history?.messages?.length) {
                        renderHistory(history.messages)
                    }
                } catch (err) {
                    console.error('[history error]', err)
                }
            }

            function startPolling() {
                stopPolling()
                pollTimer = setInterval(async () => {
                    if (!sessionKey) return
                    try {
                        const history = await wsRequest('chat.history', {
                            sessionKey,
                            limit: 500
                        })
                        if (history?.messages) {
                            renderHistory(history.messages)
                        }
                    } catch {}
                }, 500)
            }

            function stopPolling() {
                if (pollTimer) {
                    clearInterval(pollTimer)
                    pollTimer = null
                }
            }

            async function sendMessage(e) {
                e.preventDefault()
                const input = document.getElementById('input')
                const text = input.value.trim()
                if (!text || !connected || sending) return

                input.value = ''
                sending = true
                setStatus('Sending...', 'text-yellow-500')

                addMessage(text, 'user')
                streamBubble = null

                try {
                    const res = await wsRequest('chat.send', {
                        sessionKey,
                        message: text,
                        deliver: true,
                        timeoutMs: 120000,
                        idempotencyKey: uuid()
                    })
                    console.log('[chat.send]', res)

                    setStatus('Connected', 'text-green-500')
                } catch (err) {
                    console.error('[chat.send error]', err)
                    setStatus('Error: ' + err.message, 'text-red-500')
                    addSystemMessage('Failed: ' + err.message)
                    stopPolling()
                } finally {
                    sending = false
                }
            }
        </script>
    </body>
</html>
